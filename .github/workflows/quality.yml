name: Quality

on:
  pull_request:
  push:
    branches:
      - fix/firefox-extension-reliability-p0
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.18.0'

jobs:
  diff-check:
    name: git diff check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check whitespace errors
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$EVENT_BEFORE...$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^..$GITHUB_SHA"
          fi

  build-shared-backend:
    name: build shared and backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean dependency installation
        run: npm ci
      - name: Build shared package
        run: npm run build -w @vietdub/shared
      - name: Build backend package
        run: npm run build -w @vietdub/backend

  build-firefox:
    name: build Firefox independently
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean dependency installation
        run: npm ci
      - name: Build and validate Firefox artifact
        run: npm run build:firefox

  build-chrome:
    name: build Chrome independently
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean dependency installation
        run: npm ci
      - name: Build and validate Chrome artifact
        run: npm run build:chrome

  build-all:
    name: full build and artifact validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean dependency installation
        run: npm ci
      - name: Full workspace build and validation
        run: npm run build

  typecheck:
    name: typecheck workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean dependency installation
        run: npm ci
      - name: Build shared types
        run: npm run build -w @vietdub/shared
      - name: Typecheck extension
        run: npm run typecheck -w @vietdub/extension
      - name: Typecheck tests workspace
        run: npm run build -w @vietdub/tests

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean dependency installation
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean dependency installation
        run: npm ci
      - name: Run integration tests
        run: npm run test:integration

  bundle-smoke:
    name: extension bundle smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean dependency installation
        run: npm ci
      - name: Run artifact-only bundle smoke
        run: npm run test:e2e -w @vietdub/tests -- --project=bundle-smoke

  full-test:
    name: full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean dependency installation
        run: npm ci
      - name: Run complete test inventory
        run: npm test

  dependency-audit:
    name: production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Clean dependency installation
        run: npm ci
      - name: Audit production dependency tree
        run: npm audit --omit=dev
      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
      - name: Scan tracked source for provider key material
        shell: bash
        run: |
          matches="$(git grep -n -I -E '(AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|gcp-[A-Za-z0-9_-]{20,}|DEEPGRAM_API_KEY[[:space:]]*=[[:space:]]*[^[:space:]#]+|GEMINI_API_KEY[[:space:]]*=[[:space:]]*[^[:space:]#]+|GOOGLE_APPLICATION_CREDENTIALS_JSON[[:space:]]*=[[:space:]]*[^[:space:]#]+)' -- ':!package-lock.json' ':!.env.example' || true)"
          matches="$(printf '%s\n' "$matches" | grep -v -E 'your_[A-Za-z0-9_]+_here' || true)"
          if [[ -n "$matches" ]]; then
            echo 'Potential provider secret detected in tracked files.'
            printf '%s\n' "$matches"
            exit 1
          fi
